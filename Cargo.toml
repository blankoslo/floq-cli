[package]
name = "floq"
version = "0.5.0"
authors = ["Trond Øydna <trond.oydna@blank.no>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = "0.3"
rouille = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
jwt = "0.13"
toml = "0.5"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = "4.4"
prettytable-rs = "^0.8"
open = "5.0"
reqwest = "0.11"
tokio = { version = "1.32", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "fs",
    "time",
] }

[dev-dependencies]
demonstrate = { version = "0.4" }
